[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auditpilot"
version = "0.1.0"
description = "Autonomous technical SEO audit agent by Cynbit"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aman Porwal", email = "aman@cynbit.in" },
]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.1",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "tldextract>=5.1.2",
    "textstat>=0.7.3",
    "scikit-learn>=1.4.2",
    "jinja2>=3.1.4",
    "streamlit>=1.34.0",
    "plotly>=5.22.0",
    "pandas>=2.2.2",
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "google-genai>=1.0.0",
    "groq>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.4",
]

[project.scripts]
auditpilot = "auditpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auditpilot"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["auditpilot"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

